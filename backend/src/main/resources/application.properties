spring.application.name=estacion-agua

# --- Base de datos (los valores por defecto coinciden con .env.example) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:aguadb}
spring.datasource.username=${DB_USER:aguauser}
spring.datasource.password=${DB_PASSWORD:aguapass_dev}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# --- Seguridad del nodo: el ESP32 debe enviar esta clave en la cabecera X-API-KEY ---
app.api-key=${API_KEY:clave-dev-123}

# --- Aprendizaje automatico ---
app.knn.k=5
# Solo para pruebas con el simulador. En la feria debe permanecer en false.
app.entrenar-con-simulados=${ENTRENAR_CON_SIMULADOS:false}

# --- Deteccion de anomalias ---
app.anomalia.ventana=20
app.anomalia.umbral-z=3.5
app.anomalia.std-min-tds=5
app.anomalia.std-min-mv=20
# --puerto donde se lanza la app
server.port=8080
# --- cargar archivo de credenciales (.env)
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]